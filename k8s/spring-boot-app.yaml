apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-app
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-app
  template:
    metadata:
      labels:
        app: spring-boot-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: spring-boot-app
          image: spring-micrometer-demo:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MANAGEMENT_METRICS_TAGS_APPLICATION
              value: "demo"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-app-service
  namespace: monitoring
spec:
  selector:
    app: spring-boot-app
  ports:
    - port: 8080
      targetPort: 8080